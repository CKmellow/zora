services:
  postgres:
    image: postgres:16
    container_name: zora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zora
      POSTGRES_USER: zora
      POSTGRES_PASSWORD: zora_password
    ports:
      - "5432:5432"
    volumes:
      - zora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zora -d zora"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zora_pg_data:
